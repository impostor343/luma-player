name: Build Direct LumaPlayer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repository root."
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Run Unit Tests
        working-directory: LumaPlayer
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: LumaPlayer
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Integrity & Signature
        run: |
          APK_PATH="LumaPlayer/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/aapt2" dump badging "$APK_PATH" | head -n 10
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"
          cp "$APK_PATH" LumaPlayer-debug.apk
          ls -lh LumaPlayer-debug.apk

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" LumaPlayer-debug.apk \
            --title "LumaPlayer Build #${{ github.run_number }}" \
            --notes "Direct signed debug APK (verified with aapt2 & apksigner)."
