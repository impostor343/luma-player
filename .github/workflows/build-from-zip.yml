name: Build LumaPlayer APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repository root."
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Run Unit Tests
        working-directory: LumaPlayer
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: LumaPlayer
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaPlayer-debug-apk
          path: LumaPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
